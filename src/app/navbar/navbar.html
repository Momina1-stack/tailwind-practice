<!-- mobile navbar -->

<div class="nav-mobile visible lg:hidden md:hidden ">
  <ul
    class="nav-tabs game-nav-bar lg:hidden bg-[linear-gradient(180deg,#030a12,#444647_42%,#58595a)] rounded-0 border-b-0 overflow-x-hidden overflow-y-hidden relative flex-nowrap flex shadow">
    <li
      class="nav-item activeNav grow flex justify-center shrink text-center  pt-[11px] pb-[11px] mb-auto text-[12px] leading-[18px] text-white "
      (click)="setIndex(0)" 
      [ngClass]="{'border-t-2  border-white ': activeIndex === 0 }">
      <a class="nav-link relative  border-white border-r  px-3 ">
        <div class="heartBeat animate-pulse blink-text relative  text-center ">
          INPLAY </div>
      </a>
    </li>
    <li
      class="nav-item grow flex justify-center shrink text-center  pt-[11px] pb-[11px] mb-auto text-[12px] leading-[18px] text-white "
       (click)="setIndex(1)" 
      [ngClass]="{'border-t-2  border-white ': activeIndex === 1 }">
      <a class="nav-link relative  rounded-0  border-white border-r  px-3 ">
        <div class="relative text-center ">EXCHANGE </div>
      </a>
    </li>
    <li class="nav-item grow flex shrink text-center pt-[11px] pb-[11px] mb-auto text-[12px] text-white
    pl-3 "  (click)="setIndex(2)" 
      [ngClass]="{'border-t-2  border-white ': activeIndex === 2 }">
      <a class="nav-link relative  border-white border-r  px-2 ">
        <div class="heartBeat animate-pulse  blink-text relative text-nowrap text-center">LIVE CASINO </div>
      </a>
    </li>
    <li
      class="nav-item  h-[19.33] grow flex shrink text-center pt-[11.33px] pb-[11px] mb-auto  text-[11px] text-white pl-1"  (click)="setIndex(3)" 
      [ngClass]="{'border-t-2  border-white ': activeIndex === 3 }">
      <a class="nav-link relative  ">
        <div class="text-nowrap"> TIPS &amp; PREVIEWS </div>
      </a>
    </li>
  </ul>
</div>
